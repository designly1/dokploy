name: Build and Push to GHCR

on:
  push:
    branches: [ci]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/designly1/dokploy

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE_NAME}:sha-${SHORT_SHA}"

          if [ "${{ github.ref }}" = "refs/heads/ci" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:ci,${IMAGE_NAME}:latest,${IMAGE_NAME}:${VERSION}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest,${IMAGE_NAME}:${VERSION}"
          else
            TAGS="${TAGS},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on your server:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/ci" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "docker service update --image ${IMAGE_NAME}:latest --force dokploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docker service update --image ${IMAGE_NAME}:sha-${GITHUB_SHA::7} --force dokploy" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
